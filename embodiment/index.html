<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embodiment</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #status { position: fixed; left: 12px; bottom: 10px; color: #888; font: 13px sans-serif; }
      #controls { position: fixed; right: 12px; bottom: 34px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 70vw; }
      #controls button { font: 13px sans-serif; padding: 6px 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 6px; cursor: pointer; }
      #controls button:hover { background: #333; }
      #controls .evict { border-color: #a35; color: #fbc; }
      #caption { position: fixed; left: 0; right: 0; top: 16px; text-align: center; color: #bbb; font: 16px sans-serif; }
      body.booth #controls, body.booth #status, body.booth #caption { display: none; }
    </style>
  </head>
  <body>
    <div id="caption"></div>
    <div id="status">Loading character…</div>
    <div id="controls">
      <button data-act="stone">🪨 Stone</button>
      <button data-act="tomato">🍅 Tomato</button>
      <button data-act="paint">🎨 Paint</button>
      <button data-act="egg">🥚 Rotten egg</button>
      <button data-act="pie">🥧 Cream pie</button>
      <button data-act="evict" class="evict">🚀 Evict</button>
      <button data-act="talk">Talk test</button>
      <button id="mic">Mic lip-sync: off</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
